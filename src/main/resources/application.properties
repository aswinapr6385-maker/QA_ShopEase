# --- Input & Output Paths ---
# Where the analyzer writes HTML and JSON reports
analyzer.output.directory=reports

# --- Jira Integration ---
# Set to true if you want automated bug tickets created
jira.enabled=false
jira.base.url=https://yourcompany.atlassian.net
jira.project.key=QA
jira.username=qa-bot@company.com
jira.issue.type=Bug
# NOTE: DO NOT put your Jira API token here! Use Environment Variables.

# --- Slack Integration ---
# Set to true to send instant alerts to your team channel
slack.enabled=false
slack.channel=#automation-alerts
# NOTE: DO NOT put your webhook URL here! Use Environment Variables.

# --- AI / LLM Configuration ---
# 'local' uses Ollama on localhost. 'none' uses deterministic heuristics.
llm.provider=local
llm.url=http://localhost:11434
llm.model=llama3:8b
llm.timeout.seconds=30
llm.fallback.enabled=true